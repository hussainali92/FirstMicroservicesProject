apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: currency-exchange
  name: currency-exchange
spec:
  replicas: 1
  selector:
    matchLabels:
      app: currency-exchange
  template:
    metadata:
      labels:
        app: currency-exchange
    spec:
      containers:
         - name: currency-exchange
           image: imadmin1992/currency-exchange:latest
           imagePullPolicy: Always
           ports:
             - containerPort: 8000
