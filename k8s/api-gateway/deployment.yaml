apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-gateway
  labels:
    app: api-gateway

spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
        - name: api-gateway
          image: imadmin1992/api-gateway:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8765

          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://naming-server:8761/eureka

            - name: SPRING_CONFIG_IMPORT
              value: optional:configserver:http://config-server:8888