apiVersion: apps/v1
kind: Deployment

metadata:
  name: naming-server
  labels:
    app: naming-server

spec:
  replicas: 1

  selector:
    matchLabels:
      app: naming-server

  template:
    metadata:
      labels:
        app: naming-server

    spec:
      containers:
        - name: naming-server
          image: imadmin1992/naming-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8761